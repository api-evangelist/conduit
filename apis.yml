aid: conduit
name: Conduit
description: >-
  Conduit is a blockchain infrastructure provider that lets teams design, deploy, and operate
  production-grade rollups (OP Stack, Arbitrum Orbit, Agglayer CDK) without running the chain
  themselves — "you build the product, we run the chain." It offers self-serve rollup deployment,
  the G3 sequencer, managed high-performance RPC nodes across 60+ networks, a bundled block
  explorer, account-abstraction bundlers, gas sponsorship, and bridged USDC. Developers reach the
  JSON-RPC endpoints with an API key appended to the RPC URL, or through the agentic Machine
  Payments Protocol (MPP) gateway at mpp.conduit.xyz that authenticates with USDC payment channels
  on Tempo. Conduit powers chains for Aevo, Zora, Mode, and others, and is backed by Paradigm.
